<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="barrierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff006e"/>
      <stop offset="100%" style="stop-color:#fb5607"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2cbf"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg2)"/>
  <!-- Potential barrier -->
  <rect x="150" y="50" width="100" height="150" fill="url(#barrierGrad)" fill-opacity="0.3" stroke="url(#barrierGrad)" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fb5607" font-weight="bold">
    Barrera de Potencial V₀
  </text>
  <!-- Incident wave from left -->
  <g filter="url(#glow2)">
    <path d="M50,180 Q80,160 110,140 Q130,130 150,125 Q160,120 170,115" 
          fill="none" stroke="url(#waveGrad2)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;50" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Reflected wave -->
    <path d="M150,125 Q130,110 110,90 Q90,75 70,70" 
          fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;30" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Transmitted wave (smaller amplitude) -->
  <g filter="url(#glow2)">
    <path d="M250,120 Q270,115 290,110 Q310,105 330,100" 
          fill="none" stroke="#7b2cbf" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Probability density bars -->
  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#7b2cbf" opacity="0.6">
    <text x="100" y="230" text-anchor="middle">|ψ|² incidente</text>
    <text x="300" y="230" text-anchor="middle">|ψ|² transmitido</text>
  </g>
  <!-- Arrow incident -->
  <path d="M80,200 L120,200" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4ff"/>
    </marker>
  </defs>
  <text x="100" y="195" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#00d4ff">Incidente</text>
  <!-- Arrow transmitted -->
  <path d="M270,80 L310,80" stroke="#7b2cbf" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b2cbf"/>
    </marker>
  </defs>
  <text x="290" y="75" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#7b2cbf">Transmitido</text>
  <!-- Labels -->
  <text x="200" y="25" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#00d4ff" font-weight="bold">
    Efecto Túnel Cuántico · E < V₀
  </text>
  <text x="200" y="245" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fb5607" opacity="0.7">
    T ≈ exp(-2κL) · κ = √[2m(V₀-E)]/ℏ
  </text>
  <!-- Coming soon badge -->
  <rect x="130" y="95" width="140" height="30" rx="5" fill="#1a1a2e" stroke="#fb5607" stroke-width="1.5" opacity="0.9"/>
  <text x="200" y="117" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fb5607" font-weight="bold">
    🚧 Manim Pending
  </text>
</svg>
