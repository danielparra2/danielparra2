<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="quantumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2cbf"/>
      <stop offset="100%" style="stop-color:#ff006e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#quantumBg)"/>
  <!-- Quantum particles background -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="2" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="80" r="1.5" fill="#ff006e"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="250" r="1" fill="#7b2cbf"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="220" r="2" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="150" r="1.5" fill="#ff006e"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Schrödinger's Box -->
  <rect x="120" y="80" width="160" height="140" rx="10" fill="none" stroke="url(#catGradient)" stroke-width="3" filter="url(#glow)"/>
  <line x1="140" y1="80" x2="140" y2="220" stroke="url(#catGradient)" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="260" y1="80" x2="260" y2="220" stroke="url(#catGradient)" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <!-- Cat silhouette (superposition) -->
  <g filter="url(#glow)">
    <!-- Alive cat -->
    <path d="M160,180 Q150,160 160,140 Q170,130 185,135 Q195,130 200,140 Q210,155 200,170 Q190,180 180,180 Z" 
          fill="url(#catGradient)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="165" cy="145" rx="8" ry="6" fill="url(#catGradient)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="195" cy="145" rx="8" ry="6" fill="url(#catGradient)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Dead cat (ghost) -->
    <path d="M160,180 Q150,160 160,140 Q170,130 185,135 Q195,130 200,140 Q210,155 200,170 Q190,180 180,180 Z" 
          fill="#1a1a2e" stroke="#ff006e" stroke-width="2" stroke-dasharray="8,4" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="165" cy="145" rx="8" ry="6" fill="none" stroke="#ff006e" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="195" cy="145" rx="8" ry="6" fill="none" stroke="#ff006e" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- Quantum state labels -->
  <text x="200" y="60" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" fill="#00d4ff" font-weight="bold">
    | Ψ ⟩ = α|Alive⟩ + β|Dead⟩
  </text>
  <text x="200" y="245" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7b2cbf" opacity="0.8">
    Superposición cuántica · Observador colapsa la función de onda
  </text>
  <!-- Probability amplitudes -->
  <g font-family="'JetBrains Mono',monospace" font-size="10" fill="#00d4ff">
    <text x="130" y="115" text-anchor="middle" opacity="0.7">|α|²</text>
    <text x="270" y="115" text-anchor="middle" opacity="0.7">|β|²</text>
  </g>
  <!-- Wave function visualization -->
  <path d="M130,195 Q160,170 200,195 Q240,220 270,195" fill="none" stroke="url(#catGradient)" stroke-width="2" stroke-dasharray="6,3" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="200" y="190" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7b2cbf" opacity="0.7">
    ψ(x,t) evolución temporal
  </text>
</svg>
