<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Gato de Schrödinger teletransportándose entre los estados vivo, superposición y muerto">
  <title>Gato de Schrödinger teletransportándose</title>
  <desc>Un gato salta entre tres estaciones cuánticas: vivo, superposición y muerto. Cada salto usa un portal, un destello y partículas.</desc>

  <defs>
    <filter id="inkblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <path id="catShape" d="M 151.34904,307.20455 L 264.34904,307.20455 C 264.34904,291.14096 263.2021,287.95455 236.59904,287.95455 C 240.84904,275.20455 258.12424,244.35808 267.72404,244.35808 C 276.21707,244.35808 286.34904,244.82592 286.34904,264.20455 C 286.34904,286.20455 323.37171,321.67547 332.34904,307.20455 C 345.72769,285.63897 309.34904,292.21514 309.34904,240.20455 C 309.34904,169.05135 350.87417,179.18071 350.87417,139.20455 C 350.87417,119.20455 345.34904,116.50374 345.34904,102.20455 C 345.34904,83.30695 361.99717,84.403577 358.75805,68.734879 C 356.52061,57.911656 354.76962,49.23199 353.46516,36.143889 C 352.53959,26.857305 352.24452,16.959398 342.59855,17.357382 C 331.26505,17.824992 326.96549,37.77419 309.34904,39.204549 C 291.76851,40.631991 276.77834,24.238028 269.97404,26.579549 C 263.22709,28.901334 265.34904,47.204549 269.34904,60.204549 C 275.63588,80.636771 289.34904,107.20455 264.34904,111.20455 C 239.34904,115.20455 196.34904,119.20455 165.34904,160.20455 C 134.34904,201.20455 135.49342,249.3212 123.34904,264.20455 C 82.590696,314.15529 40.823919,293.64625 40.823919,335.20455 C 40.823919,353.81019 72.349045,367.20455 77.349045,361.20455 C 82.349045,355.20455 34.863764,337.32587 87.995492,316.20455 C 133.38711,298.16014 137.43914,294.47663 151.34904,307.20455 z"/>
  </defs>

  <!-- paper -->
  <rect width="1200" height="220" fill="#F4EFE6"/>
  <rect x="0.6" y="0.6" width="1198.8" height="218.8" fill="none" stroke="#141414" stroke-opacity="0.18" stroke-width="1.2"/>
  <line x1="24" y1="18" x2="1176" y2="18" stroke="#141414" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="24" y1="202" x2="1176" y2="202" stroke="#141414" stroke-opacity="0.12" stroke-width="1"/>

  <!-- quantum trajectory -->
  <path d="M150 120 Q375 58 600 120 T1050 120" fill="none" stroke="#141414" stroke-opacity="0.20" stroke-width="1.4" stroke-dasharray="4 9"/>
  <path d="M150 120 Q375 182 600 120 T1050 120" fill="none" stroke="#D9480F" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="3 10"/>

  <!-- ground -->
  <line x1="70" y1="172" x2="1130" y2="172" stroke="#141414" stroke-opacity="0.18" stroke-width="1"/>

  <!-- station labels -->
  <g text-anchor="middle" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" fill="#141414">
    <text x="150" y="52" font-size="15">|vivo⟩</text>
    <text x="600" y="52" font-size="15">|ψ⟩</text>
    <text x="1050" y="52" font-size="15">|muerto⟩</text>
    <text x="600" y="212" font-size="10" fill="#141414" fill-opacity="0.55">|ψ⟩ = α|vivo⟩ + β|muerto⟩</text>
  </g>

  <!-- portals -->
  <g fill="none" stroke="#D9480F" stroke-width="1.8">
    <!-- station 1: left -->
    <circle cx="150" cy="120" r="10" opacity="0">
      <animate attributeName="r" values="10;10;70;10;10;10;70;10;10" keyTimes="0;0.18;0.24;0.27;0.78;0.80;0.83;0.86;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0;0;0.85;0;0" keyTimes="0;0.18;0.24;0.27;0.78;0.80;0.83;0.86;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- station 2: center -->
    <circle cx="600" cy="120" r="10" opacity="0">
      <animate attributeName="r" values="10;10;70;10;10;10;70;10;10" keyTimes="0;0.24;0.25;0.28;0.52;0.53;0.54;0.57;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0;0;0.85;0;0" keyTimes="0;0.24;0.25;0.28;0.52;0.53;0.54;0.57;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- station 3: right -->
    <circle cx="1050" cy="120" r="10" opacity="0">
      <animate attributeName="r" values="10;10;70;10;10;70;10;10" keyTimes="0;0.53;0.54;0.57;0.82;0.83;0.86;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0;0.85;0;0" keyTimes="0;0.53;0.54;0.57;0.82;0.83;0.86;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- particle bursts at arrival points -->
  <g fill="#D9480F">
    <g transform="translate(600 120)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.24;0.25;0.31;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.0;2.2;2.2" keyTimes="0;0.24;0.27;0.31;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="-34" r="2.2"/><circle cx="24" cy="-24" r="1.8"/>
        <circle cx="34" cy="0" r="2.1"/><circle cx="24" cy="24" r="1.6"/>
        <circle cx="0" cy="34" r="2.3"/><circle cx="-24" cy="24" r="1.8"/>
        <circle cx="-34" cy="0" r="2.1"/><circle cx="-24" cy="-24" r="1.7"/>
      </g>
    </g>
    <g transform="translate(1050 120)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.53;0.54;0.60;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.0;2.2;2.2" keyTimes="0;0.53;0.56;0.60;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="-34" r="2.2"/><circle cx="24" cy="-24" r="1.8"/>
        <circle cx="34" cy="0" r="2.1"/><circle cx="24" cy="24" r="1.6"/>
        <circle cx="0" cy="34" r="2.3"/><circle cx="-24" cy="24" r="1.8"/>
        <circle cx="-34" cy="0" r="2.1"/><circle cx="-24" cy="-24" r="1.7"/>
      </g>
    </g>
    <g transform="translate(150 120)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.82;0.83;0.89;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.0;2.2;2.2" keyTimes="0;0.82;0.85;0.89;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="-34" r="2.2"/><circle cx="24" cy="-24" r="1.8"/>
        <circle cx="34" cy="0" r="2.1"/><circle cx="24" cy="24" r="1.6"/>
        <circle cx="0" cy="34" r="2.3"/><circle cx="-24" cy="24" r="1.8"/>
        <circle cx="-34" cy="0" r="2.1"/><circle cx="-24" cy="-24" r="1.7"/>
      </g>
    </g>
  </g>

  <!-- ghost in superposition (center) -->
  <g opacity="0" fill="#D9480F">
    <animate attributeName="opacity" values="0;0;0.22;0.22;0;0" keyTimes="0;0.54;0.57;0.78;0.82;1" dur="12s" repeatCount="indefinite"/>
    <use href="#catShape" transform="translate(600 120) scale(-0.22 0.22) translate(-197.5 -192)"/>
  </g>

  <!-- the cat -->
  <g fill="#141414">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1;1;0;0;0.5;0;0;1;1" keyTimes="0;0.24;0.25;0.26;0.53;0.54;0.55;0.56;0.81;0.82;0.83;0.86;1" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="150 120;600 120;1050 120;150 120;150 120" keyTimes="0;0.25;0.54;0.83;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <use href="#catShape" transform="translate(-43.45 -42.24) scale(0.22)"/>
    </g>
  </g>

  <!-- figure marks -->
  <g font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" fill="#141414" fill-opacity="0.5" font-size="9">
    <text x="24" y="34">FIG. 0</text>
    <text x="1176" y="34" text-anchor="end">12 s LOOP · SMIL</text>
  </g>
</svg>
